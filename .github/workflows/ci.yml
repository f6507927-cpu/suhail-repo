name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: engine coverage (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: coverage/engine/
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: suhail_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
          # The existing isolated search runner uses this second loopback port.
          - "127.0.0.1:55432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql://postgres@127.0.0.1:5432/suhail_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm audit --prod --audit-level high
        continue-on-error: true
      - run: pnpm lint
      - run: pnpm lint:logical
      - run: pnpm test
      - run: pnpm research:eval
      # The isolated suite applies migrations and seeds twice before role tests.
      - run: pnpm test:db
      - id: install-browser-deps
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e:stock
      - name: Run pnpm test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL_PUBLIC: postgresql://suhail_public@127.0.0.1:55432/suhail_test
          DATABASE_URL_APP: postgresql://suhail_app@127.0.0.1:55432/suhail_test
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3500
          PLAYWRIGHT_PUBLIC_FIXTURE: "1"
          PLAYWRIGHT_FIXTURE_MODE: development
          PLAYWRIGHT_TEST_SERVER: "1"
          SITE_MODE: preview
        run: |
          # test:db has applied migrations. Open restricted logins only in the CI service.
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL_TEST" \
            -c 'ALTER ROLE suhail_public LOGIN' -c 'ALTER ROLE suhail_app LOGIN'
          test "$(psql -XAt "$DATABASE_URL_PUBLIC" -c 'SELECT current_user')" = suhail_public
          test "$(psql -XAt "$DATABASE_URL_APP" -c 'SELECT current_user')" = suhail_app

          # The externally managed runner needs the same synthetic data as the
          # Playwright-owned isolated runner.
          pnpm exec tsx --conditions=react-server tests/search-browser/setup.ts

          # Next compiles NODE_ENV to development, so raw pnpm dev rejects loopback.
          # Use the existing isolated real-Next runner and its strict public-role adapter.
          setsid pnpm exec tsx tests/search-browser/server.ts &
          server=$!
          trap 'kill -- "-$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 120))
          until curl --silent --fail --max-time 2 "$PLAYWRIGHT_BASE_URL/api/health" >/dev/null; do
            if ! kill -0 "$server" 2>/dev/null || (( SECONDS >= deadline )); then
              echo "Real Next.js browser fixture did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          pnpm test:e2e
      # D-218: these suites own their populated SSR/client fixture servers.
      # Keep independent suite results visible even if a preceding suite fails.
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm exec playwright test --config playwright.ui-one.config.ts
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm exec playwright test --config playwright.ui-eight.config.ts
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm exec playwright test --config playwright.ui-nine.config.ts
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm test:e2e:other-methodologies-ui
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm test:e2e:other-methodologies
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm exec playwright test --config playwright.stock-ux-five.config.ts
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm test:e2e:accounts
      # Separate production Next copy: synthetic module IO, real roots/SSR/hydration.
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm test:e2e:hydration
      # D-168: phone menu navigation, Chromium and WebKit iPhone, same synthetic build.
      - if: ${{ !cancelled() && steps.install-browser-deps.outcome == 'success' }}
        run: pnpm test:e2e:menu
      # Finish all self-managed Next dev servers before building production.
      # D-102: build must never read a database, including the local test service.
      - run: env -u DATABASE_URL_MIGRATIONS -u DATABASE_URL_PUBLIC -u DATABASE_URL_APP -u DATABASE_URL_TEST -u DATABASE_URL -u PGHOST -u PGUSER -u PGDATABASE -u PGPORT -u PGPASSWORD -u SUPABASE_DB_CA_CERT pnpm build
      - run: node scripts/scan-bundle.mjs
      - run: pnpm exec playwright test --config playwright.security.config.ts
      - run: pnpm exec playwright test --config playwright.methodology-isr.config.ts
      - run: pnpm exec playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-browser-checks
          path: generated-artifacts/
      - run: docker build --build-arg GIT_SHA="$GITHUB_SHA" .
