name: Master source

# master only accepts pull requests from development in this repository.
on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  source:
    name: master-source
    runs-on: ubuntu-latest
    steps:
      - name: Only development may merge into master
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "development" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "Pull requests into master must come from development in this repository (got $HEAD_REPO:$HEAD_REF)."
            exit 1
          fi
          echo "Source branch is development."
